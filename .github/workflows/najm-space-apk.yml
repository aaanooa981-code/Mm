name: Build Najm Space APK
on:
  push:
    branches: [najm-space-apk-build]
    paths:
      - 'najm-space/**'
      - '.github/workflows/najm-space-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK packages
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare Najm Space launcher icon
        run: |
          mkdir -p najm-space/app/src/main/res/mipmap-mdpi
          echo '' | base64 -d > najm-space/app/src/main/res/mipmap-mdpi/ic_launcher.png
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: najm-space
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Najm_Space_V1.8_API19
          path: najm-space/app/build/outputs/apk/debug/app-debug.apk
