name: Build Najm Space APK
on:
  push:
    branches: [najm-space-apk-build]
    paths:
      - 'najm-space/**'
      - '.github/workflows/najm-space-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prepare Najm Container engine
        run: |
          rm -rf /tmp/DroidPlugin najm-space/droidplugin
          git clone -q https://github.com/DroidPluginTeam/DroidPlugin.git /tmp/DroidPlugin
          git -C /tmp/DroidPlugin checkout -q c6ebf652e0f73aa0e5746766e117e51efaf41dbd
          cp -R /tmp/DroidPlugin/project/Libraries/DroidPlugin najm-space/droidplugin
          mkdir -p najm-space/app/src/main/assets/licenses
          cp /tmp/DroidPlugin/LICENSE najm-space/app/src/main/assets/licenses/DroidPlugin-LGPL-3.0.txt
          printf 'DroidPlugin source: https://github.com/DroidPluginTeam/DroidPlugin\nPinned commit: c6ebf652e0f73aa0e5746766e117e51efaf41dbd\nLocal compatibility patch: PackageParser.collectCertificates supports both (Package,int) and Android 9+ (Package,boolean).\n' > najm-space/app/src/main/assets/licenses/DroidPlugin-SOURCE.txt
          sed -i 's/package="com.morgoo.droidplugin"//' najm-space/droidplugin/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('najm-space/droidplugin/src/main/java/com/morgoo/droidplugin/pm/parser/PackageParserApi21.java')
          s = p.read_text(encoding='utf-8')
          old = '''    @Override
              public void collectCertificates(int flags) throws Exception {
                  // public void collectCertificates(Package pkg, int flags) throws PackageParserException
                  Method method = MethodUtils.getAccessibleMethod(sPackageParserClass, "collectCertificates",
                          mPackage.getClass(), int.class);
                  method.invoke(mPackageParser, mPackage, flags);
              }
          '''
          # Match without relying on exact indentation inserted by YAML.
          old = old.replace('              ', '    ')
          new = '''    @Override
              public void collectCertificates(int flags) throws Exception {
                  // Android 5-8 used collectCertificates(Package,int).
                  // Android 9 changed it to collectCertificates(Package,boolean).
                  try {
                      Method method = MethodUtils.getAccessibleMethod(sPackageParserClass, "collectCertificates",
                              mPackage.getClass(), int.class);
                      method.invoke(mPackageParser, mPackage, flags);
                  } catch (NoSuchMethodException oldSignatureMissing) {
                      Method method = MethodUtils.getAccessibleMethod(sPackageParserClass, "collectCertificates",
                              mPackage.getClass(), boolean.class);
                      method.invoke(null, mPackage, false);
                  }
              }
          '''.replace('              ', '    ')
          if old not in s:
              raise SystemExit('collectCertificates patch target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          cat > najm-space/droidplugin/build.gradle <<'EOF'
          plugins { id 'com.android.library' }
          android {
              namespace 'com.morgoo.droidplugin'
              compileSdk 35
              defaultConfig {
                  minSdk 19
                  targetSdk 28
                  buildConfigField "String", "AUTHORITY_NAME", "\"com.najmspace.app.droidplugin_stub\""
                  manifestPlaceholders = [authorityName:"com.najmspace.app.droidplugin_stub"]
              }
              buildFeatures {
                  aidl true
                  buildConfig true
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              lint { abortOnError false }
          }
          dependencies {
              compileOnly fileTree(dir: 'lib', include: ['*.jar'])
              implementation fileTree(dir: 'libs', include: ['*.jar'])
          }
          EOF

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download bundled ReVanced Manager
        run: |
          mkdir -p najm-space/app/src/main/assets/preload najm-space/app/src/main/assets/licenses
          curl -L --fail --retry 3 \
            https://github.com/ReVanced/revanced-manager/releases/download/v2.6.0/revanced-manager-2.6.0.apk \
            -o najm-space/app/src/main/assets/preload/revanced-manager-2.6.0.apk
          echo "cba4c461553ea74eb25a7b2e1842419c7f4f40adc619b10d518c114204b7e846  najm-space/app/src/main/assets/preload/revanced-manager-2.6.0.apk" | sha256sum -c -
          curl -L --fail https://raw.githubusercontent.com/ReVanced/revanced-manager/v2.6.0/LICENSE \
            -o najm-space/app/src/main/assets/licenses/ReVanced-Manager-GPL-3.0.txt
          printf 'ReVanced Manager source: https://github.com/ReVanced/revanced-manager/tree/v2.6.0\nBundled APK version: 2.6.0\n' > najm-space/app/src/main/assets/licenses/ReVanced-Manager-SOURCE.txt

      - name: Download Android 4.4 YouTube client
        run: |
          mkdir -p najm-space/app/src/main/assets/preload najm-space/app/src/main/assets/licenses
          curl -L --fail --retry 3 \
            https://github.com/SkyTubeTeam/SkyTube/releases/download/v2.999/SkyTube-Oss-2.999.apk \
            -o najm-space/app/src/main/assets/preload/SkyTube-Oss-2.999.apk
          echo "4877082e76796fdeab5f848d847577253999b71195765fbf187c6eb5222e197e  najm-space/app/src/main/assets/preload/SkyTube-Oss-2.999.apk" | sha256sum -c -
          curl -L --fail https://raw.githubusercontent.com/SkyTubeTeam/SkyTube/v2.999/LICENSE \
            -o najm-space/app/src/main/assets/licenses/SkyTube-GPL-3.0.txt
          printf 'SkyTube source: https://github.com/SkyTubeTeam/SkyTube/tree/v2.999\nBundled APK: SkyTube OSS 2.999\nMinimum Android: API 19 / Android 4.4\n' > najm-space/app/src/main/assets/licenses/SkyTube-SOURCE.txt

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: najm-space
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Najm_Space_V3.3_CONTAINER_COMPAT_API19
          path: najm-space/app/build/outputs/apk/debug/app-debug.apk
