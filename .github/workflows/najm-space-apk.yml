name: Build Najm Space APK
on:
  push:
    branches: [najm-space-apk-build]
    paths:
      - 'najm-space/**'
      - '.github/workflows/najm-space-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: najm-space
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Najm_Space_V0.1_API19
          path: najm-space/app/build/outputs/apk/debug/app-debug.apk
